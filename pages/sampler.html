<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Lab</title>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/pages.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html">SAMPLE//LAB</a>
    <nav>
      <a href="../index.html">HOME</a>
      <a class="active" href="sampler.html" aria-current="page">SAMPLER</a>
      <a href="history.html">HISTORY</a>
      <a href="about.html">ABOUT</a>
    </nav>
  </header>

  <main class="sampler-main">
    <section class="sampler-top">
      <div>
        <div class="eyebrow">LOCAL PROTOTYPE</div>
        <h1>15 SECOND<br><span>SAMPLE LAB</span></h1>
      </div>
      <div class="status-box">
        <div><span class="dot"></span> SYSTEM READY</div>
        <small>브라우저 Web Audio 기반 데모</small>
      </div>
    </section>

    <section class="control-panel">
      <div class="control">
        <label for="genre">GENRE</label>
        <select id="genre"></select>
      </div>

      <div class="control">
        <label for="subgenre">SUBGENRE</label>
        <select id="subgenre"></select>
      </div>

      <div class="control">
        <label for="sampleType">SAMPLE TYPE</label>
        <select id="sampleType"></select>
      </div>

      <div class="control">
        <label for="count">COUNT</label>
        <select id="count"></select>
      </div>

      <div class="control prompt-control">
        <label for="prompt">IDEA / PROMPT</label>
        <input id="prompt" type="text" placeholder="예: dry female vocal, late night, minimal bass" />
      </div>

      <button id="generateBtn" type="button" class="button primary generate-button">GENERATE</button>
    </section>

    <section class="generation-status" id="generationStatus" aria-live="polite">
      <span>READY</span>
      <div class="progress-track" role="progressbar" aria-label="샘플 생성 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>

    <section>
      <div class="section-heading-row">
        <div class="section-title">GENERATED SAMPLES</div>
        <button id="clearBtn" type="button" class="text-button">CLEAR</button>
      </div>
      <div id="sampleGrid" class="sample-grid">
        <div class="empty-state">
          조건을 선택하고 GENERATE를 눌러주세요.
        </div>
      </div>
    </section>
  </main>

  <footer>
    실제 YuE2 모델이 아닌 HTML/CSS/JS 과제용 인터랙션 프로토타입
  </footer>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/storage.js"></script>
  <script src="../assets/js/core/audio-engine.js"></script>
  <script src="../assets/js/pages/sampler-page.js"></script>
</body>
</html>
